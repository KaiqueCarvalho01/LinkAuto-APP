name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: linkauto-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Detect frontend changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(linkauto-frontend/|\.github/workflows/frontend\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, types, tests and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linkauto-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  frontend-ok:
    name: Frontend OK
    needs: [changes, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a frontend job failed or was cancelled
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
