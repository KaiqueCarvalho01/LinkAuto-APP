name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: linkauto-backend

jobs:
  # Decides whether the backend changed. The jobs below always run (and report a status), so
  # they can be required checks on `main` without blocking frontend-only PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Detect backend changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(linkauto-backend/|\.github/workflows/backend\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, types, tests and migrations
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: linkauto-backend
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: pytest
        run: uv run pytest
      - name: Migrations (fresh SQLite)
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
          APP_ENV: ci
        run: |
          uv run alembic upgrade head
          uv run alembic check

  postgres:
    name: Migrations (PostgreSQL + PostGIS)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkauto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkauto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/linkauto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: linkauto-backend
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Upgrade, check, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  # Single stable check to mark as required on `main`.
  backend-ok:
    name: Backend OK
    needs: [changes, checks, postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a backend job failed or was cancelled
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
