services:
  # Default (SQLite) backend: the database is re-created and seeded on startup.
  backend:
    build:
      context: ../linkauto-backend
      dockerfile: Dockerfile
      target: development
    container_name: linkauto-backend
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ../linkauto-backend:/workspace
      # Keep the image's venv (built by `uv sync`) instead of the host's, which the bind
      # mount above would otherwise shadow
      - /workspace/.venv
    env_file:
      - ../linkauto-backend/.env.example
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ../linkauto-frontend
      dockerfile: Dockerfile
      target: development
    container_name: linkauto-frontend
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ../linkauto-frontend:/workspace
      - /workspace/node_modules
    env_file:
      - ../linkauto-frontend/.env.example
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Optional PostgreSQL + PostGIS stack (activated with --profile postgres)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: linkauto-postgres
    profiles:
      - postgres
      - prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: linkauto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off release step: applies Alembic migrations, then exits. The backend only starts
  # after it completed successfully, as a pre-deploy step would in production.
  migrate:
    build:
      context: ../linkauto-backend
      dockerfile: Dockerfile
      target: development
    profiles:
      - postgres
      - prod
    working_dir: /workspace
    volumes:
      - ../linkauto-backend:/workspace
      - /workspace/.venv
    env_file:
      - ../linkauto-backend/.env.example
    environment: &postgres-env
      APP_ENV: staging
      RESET_SQLITE_ON_STARTUP: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres_dev_password@postgres:5432/linkauto
    command: ["sh", "scripts/migrate.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend-postgres:
    build:
      context: ../linkauto-backend
      dockerfile: Dockerfile
      target: development
    container_name: linkauto-backend-postgres
    profiles:
      - postgres
      - prod
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ../linkauto-backend:/workspace
      - /workspace/.venv
    env_file:
      - ../linkauto-backend/.env.example
    environment: *postgres-env
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
