# Alembic runtime configuration. Source settings (script_location, etc.) live in
# pyproject.toml under [tool.alembic].
#
# The database URL is not set here: alembic/env.py reads it from the application
# settings (DATABASE_URL environment variable or .env), same as the app itself.

[alembic]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
