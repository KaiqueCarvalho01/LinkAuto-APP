[project]
name = "linkauto-backend"
version = "0.1.0"
description = "LinkAuto backend API services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "limits[redis]>=5.8",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.1,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

# Keep generated revisions compliant with the project's Ruff configuration
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.ty.rules]
all = "error"
# `x: Mapped[T] = mapped_column(...)` is SQLAlchemy's own idiom; mapped_column() is MappedColumn[Any]
unsound-assignment = "ignore"
# Returning values from untyped libraries (python-jose, boto3) and parsed JSON
unsound-return-statement = "ignore"
# slowapi's @limiter.limit is untyped
dynamic-function-decorator-return = "ignore"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Fail on warnings raised by our own code, so new deprecations are fixed early
    "error::DeprecationWarning:app\\..*",
    # slowapi 0.1.10 calls asyncio.iscoroutinefunction, removed in Python 3.16. Upstream:
    # https://github.com/laurentS/slowapi/issues/263 (fix PRs #246/#264/#291 still open).
    # Must be fixed (upgrade, patch or replace slowapi) before moving to Python 3.16.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi\\..*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812", # missing-trailing-comma
    # Mutually exclusive docstring styles; pick D211 and D212 explicitly to silence the warnings
    "D203",   # incorrect-blank-line-before-class (vs D211 blank-line-before-class)
    "D213",   # multi-line-summary-second-line (vs D212 multi-line-summary-first-line)
    # No license or copyright policy in this repository
    "CPY001", # missing-copyright-notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert: the pytest way of asserting
    "D1",      # undocumented-*: test names describe the tests
    "PLR2004", # magic-value-comparison: expected values (status codes, counts) in assertions
    "S105",    # hardcoded-password-string: fake test credentials
    "S106",    # hardcoded-password-func-arg: fake test credentials
    "S107",    # hardcoded-password-default: fake test credentials
]
"alembic/**" = [
    "INP001", # implicit-namespace-package: Alembic loads env.py and revisions by file path
]
"alembic/versions/**" = [
    "D103", # undocumented-public-function: upgrade()/downgrade() are Alembic's API
    "E501", # line-too-long: autogenerated revision files
]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make the package look first-party
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic, SQLModel and FastAPI resolve annotations at runtime, so the types they use
# must stay importable at runtime instead of moving into `if TYPE_CHECKING:` blocks.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlmodel.SQLModel",
    "app.models.base.AuditTimestampsMixin",
    "app.models.base.AuditUUIDBase",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.exception_handler",
    "pydantic.field_validator",
    "pydantic.model_validator",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
